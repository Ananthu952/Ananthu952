
name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2. Create output folder
      - name: Create output folders
        run: mkdir -p profile

      # 3. Generate GitHub Stats
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=Ananthu952&show_icons=true&hide_border=true&bg_color=090A0F&title_color=00E5CC&icon_color=00BFA6&text_color=FFFFFF&ring_color=00E5CC'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate Top Languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=Ananthu952&layout=compact&langs_count=6&hide_border=true&bg_color=090A0F&title_color=00E5CC&text_color=FFFFFF'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Verify statistics
      - name: Verify Statistics
        run: |
          test -s profile/stats.svg
          test -s profile/top-langs.svg
          echo "GitHub statistics generated successfully!"

      # 6. Commit and safely push statistics
      - name: Commit GitHub Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub profile statistics"
          else
            echo "Statistics are already up to date."
          fi

          # Synchronize with remote before pushing
          git pull --rebase origin main

          git push origin HEAD:main

      # 7. Remove old generated files
      - name: Clean previous game files
        run: rm -rf dist

      # 8. Generate Puzzle Bobble
      - name: Generate Puzzle Bobble
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Ananthu952
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: 'puzzle-bobble'
          hide_month_labels: 'false'

      # 9. Verify Puzzle Bobble
      - name: Verify Puzzle Bobble
        run: |
          echo "Generated SVG files:"
          find dist -maxdepth 1 -type f -name "*.svg" -print

          test -s dist/puzzle-bobble-contribution-graph.svg
          test -s dist/puzzle-bobble-contribution-graph-dark.svg

          echo "Puzzle Bobble files verified!"

      # 10. Publish game to output branch
      - name: Publish Puzzle Bobble
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
