
name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output folders
        run: mkdir -p profile dist

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=Ananthu952&show_icons=true&hide_border=true&bg_color=090A0F&title_color=00E5CC&icon_color=00BFA6&text_color=FFFFFF&ring_color=00E5CC'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=Ananthu952&layout=compact&langs_count=6&hide_border=true&bg_color=090A0F&title_color=00E5CC&text_color=FFFFFF'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ananthu952
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=cyan

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg dist/*.svg
          git diff --cached --quiet || git commit -m "Update GitHub profile statistics"
          git push
